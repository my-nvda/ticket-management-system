{% extends 'base.html' %}

{% block title %}{{ error_code }} - Ticket System{% endblock %}

{% block content %}
<div class="card text-center" style="margin-top: 3rem; margin-bottom: 3rem; max-width: 600px; margin-left: auto; margin-right: auto;">
    <h1 style="font-size: 3.5rem; color: var(--primary); margin-bottom: 1rem;">{{ error_code }}</h1>
    <h2 data-en="{{ error_title_en }}" data-ar="{{ error_title_ar }}" style="margin-bottom: 1.5rem;">{{ error_title_en }}</h2>
    <p data-en="{{ error_msg_en }}" data-ar="{{ error_msg_ar }}" style="color: var(--text-muted); margin-bottom: 2rem;">{{ error_msg_en }}</p>
    <a href="{{ url_for('new_ticket') }}" class="btn btn-primary btn-lg" data-en="Return to Home" data-ar="العودة للصفحة الرئيسية">
        🏠 Return to Home
    </a>
</div>
{% endblock %}
